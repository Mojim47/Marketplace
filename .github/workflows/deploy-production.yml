# ═══════════════════════════════════════════════════════════════════════════
# NextGen Marketplace - Production Deployment Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# Enterprise-grade production deployment with full security scanning
# Triggers: push to main, manual dispatch
# Stages: security-scan → test → build → deploy
# Requirements: 1.1, 1.2, 1.3, 1.4, 1.6, 1.7, 2.2, 2.3, 2.4
# ═══════════════════════════════════════════════════════════════════════════

name: "🚀 Production Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20.18.1"
  PNPM_VERSION: "9.15.1"
  # Required health endpoints for deploy gating
  API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
  WEB_HEALTH_URL: ${{ secrets.WEB_HEALTH_URL }}
  ADMIN_HEALTH_URL: ${{ secrets.ADMIN_HEALTH_URL }}

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Security Scanning (MUST PASS - No continue-on-error)
  # Requirements: 2.2, 2.3, 2.4
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🐘 Install PostgreSQL client"
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Trivy Filesystem Scan - MUST PASS
      - name: "🛡️ Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # Fail on CRITICAL/HIGH

      - name: "📤 Upload Trivy results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-production"

      # Gitleaks Secret Scan - MUST PASS
      - name: "🔑 Run Gitleaks secret scan"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No continue-on-error - secrets MUST block deployment

      # pnpm Audit - MUST PASS for HIGH/CRITICAL
      - name: "📦 Run pnpm audit"
        run: pnpm audit --audit-level=high
        # No continue-on-error - vulnerabilities MUST block deployment

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Full Test Suite
  # Requirements: 1.6
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Full Test Suite"
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nextgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔧 Generate Prisma client"
        run: pnpm run db:generate

      - name: "🗄️ Backup + safe database migrations"
        run: pnpm run db:migrate:deploy:safe
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nextgen_test

      - name: "🧪 Run unit tests"
        run: pnpm run test:unit --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/nextgen_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

      - name: "🎲 Run property-based tests"
        run: pnpm run test:pbt
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

      - name: "🔗 Run integration tests"
        run: pnpm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/nextgen_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

      - name: "📊 Upload coverage"
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Build Application
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: "🏗️ Build Application"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔧 Generate Prisma client"
        run: pnpm run db:generate

      - name: "🚫 Check for mock files in source"
        run: node scripts/check-mock-files.mjs

      - name: "🏗️ Build application"
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: "🚫 Verify no mock files in build output"
        run: node scripts/check-mock-files.mjs

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            apps/*/dist/
            apps/*/.next/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Docker Build & Push
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Log in to Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "📝 Extract metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}

      # Scan Docker image before push
      - name: "🛡️ Build image for scanning"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: nextgen-scan:latest
          target: api

      - name: "🛡️ Scan Docker image with Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nextgen-scan:latest
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # Fail on vulnerabilities

      - name: "🚀 Build and push Docker images"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5: Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: docker
    environment:
      name: production
      url: https://api.nextgen-market.ir
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "📈 Verify scaling + pooling readiness gate"
        run: pnpm run release:scaling:check
        env:
          K8S_API_STACK_PATH: k8s/base/api-stack.yml
          K8S_HPA_PATH: k8s/base/hpa-autoscaling.yml
          HELM_VALUES_PATH: helm/values.yaml
          SCALING_READINESS_REPORT_PATH: artifacts/release/scaling-readiness-report.json

      - name: "🧪 Run chaos rollback drill gate"
        run: pnpm run release:chaos:drill
        env:
          CHAOS_DRILL_REPORT_PATH: artifacts/release/chaos-rollback-drill-report.json

      - name: "📡 Live metrics probe gate (pre-cutover)"
        run: pnpm run release:live-metrics:probe
        env:
          LIVE_METRICS_URL: ${{ secrets.NG_PROD_OBS_METRICS_URL || secrets.API_METRICS_URL }}
          LIVE_METRICS_AUTH_TOKEN: ${{ secrets.NG_PROD_OBS_METRICS_AUTH_TOKEN || '' }}
          LIVE_METRICS_TIMEOUT_MS: ${{ secrets.NG_PROD_OBS_METRICS_TIMEOUT_MS || '5000' }}
          PRODUCTION_HARDENING_CONTRACT_PATH: ops/contracts/production-hardening-contract.json

      - name: "🔐 Verify secrets policy schema gate"
        run: node scripts/release/verify-secrets-policy-schema.mjs
        env:
          SECRETS_ROTATION_POLICY_PATH: ops/contracts/secrets-rotation-policy.json
          SECRETS_ROTATION_POLICY_SCHEMA_PATH: ops/contracts/secrets-rotation-policy.schema.json

      - name: "🔐 Verify secrets contract sync gate"
        run: node scripts/release/verify-secrets-contract-sync.mjs
        env:
          SECRETS_ROTATION_POLICY_PATH: ops/contracts/secrets-rotation-policy.json
          SECRETS_ROTATION_POLICY_SCHEMA_PATH: ops/contracts/secrets-rotation-policy.schema.json
          SECRETS_ROTATION_REGISTRY_PATH: ops/contracts/secrets-rotation-registry.json
          SECRETS_ROTATION_REGISTRY_SCHEMA_PATH: ops/contracts/secrets-rotation-registry.schema.json

      - name: "🔐 Verify secrets rotation gate"
        run: node scripts/release/verify-secrets-rotation-gate.mjs
        env:
          SECRETS_ROTATION_ENFORCE: "true"
          SECRETS_PROVIDER: ${{ secrets.NG_PROD_SECRETS_PROVIDER || 'vault' }}
          SECRETS_ROTATION_MAX_AGE_DAYS: ${{ secrets.NG_PROD_SECRETS_ROTATION_MAX_AGE_DAYS || '90' }}
          SECRETS_ROTATION_REGISTRY_PATH: ops/contracts/secrets-rotation-registry.json
          VAULT_ADDR: ${{ secrets.NG_PROD_VAULT_ADDR || '' }}
          AWS_REGION: ${{ secrets.NG_PROD_AWS_REGION || '' }}
          DATABASE_URL_ROTATED_AT: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL_ROTATED_AT || secrets.DATABASE_URL_ROTATED_AT }}
          DATABASE_URL_SECRET_VERSION: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL_SECRET_VERSION || secrets.DATABASE_URL_SECRET_VERSION }}
          REDIS_URL_ROTATED_AT: ${{ secrets.NG_PROD_RUNTIME_REDIS_URL_ROTATED_AT || secrets.REDIS_URL_ROTATED_AT }}
          REDIS_URL_SECRET_VERSION: ${{ secrets.NG_PROD_RUNTIME_REDIS_URL_SECRET_VERSION || secrets.REDIS_URL_SECRET_VERSION }}
          JWT_SECRET_ROTATED_AT: ${{ secrets.NG_PROD_RUNTIME_JWT_SECRET_ROTATED_AT || secrets.JWT_SECRET_ROTATED_AT }}
          JWT_SECRET_VERSION: ${{ secrets.NG_PROD_RUNTIME_JWT_SECRET_VERSION || secrets.JWT_SECRET_VERSION }}

      - name: "🗄️ Backup production DB before migration"
        id: db_backup
        env:
          DATABASE_URL: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          backup_file="$(pnpm run --silent db:migrate:backup)"
          echo "DB_MIGRATION_BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"

      - name: "🗄️ Safe production migration gate"
        run: pnpm run db:migrate:deploy:safe
        env:
          DATABASE_URL: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL || secrets.DATABASE_URL }}
          DB_MIGRATION_BACKUP_FILE: ${{ steps.db_backup.outputs.backup_file }}

      - name: "🧭 Generate rollback runbook"
        run: node scripts/release/generate-rollback-runbook.mjs
        env:
          ARTIFACT_REF: ${{ github.sha }}
          ARTIFACT_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          DB_MIGRATION_BACKUP_FILE: ${{ steps.db_backup.outputs.backup_file }}

      - name: "🩺 DB runtime signals gate"
        run: pnpm run db:signals:check
        env:
          DATABASE_URL: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL || secrets.DATABASE_URL }}
          DB_MIGRATION_BACKUP_FILE: ${{ steps.db_backup.outputs.backup_file }}
          DB_SLOW_QUERY_THRESHOLD_MS: ${{ secrets.NG_PROD_DB_SLOW_QUERY_THRESHOLD_MS || '250' }}
          DB_MAX_SLOW_QUERIES: ${{ secrets.NG_PROD_DB_MAX_SLOW_QUERIES || '0' }}
          DB_MAX_REPLICA_LAG_SECONDS: ${{ secrets.NG_PROD_DB_MAX_REPLICA_LAG_SECONDS || '5' }}
          DB_MAX_BACKUP_AGE_HOURS: ${{ secrets.NG_PROD_DB_MAX_BACKUP_AGE_HOURS || '24' }}
          DB_REQUIRE_PG_STAT_STATEMENTS: ${{ secrets.NG_PROD_DB_REQUIRE_PG_STAT_STATEMENTS || 'true' }}
          DB_RUNTIME_SIGNALS_REPORT_PATH: artifacts/release/db-runtime-signals-prod.json

      - name: "🚀 Deploy to production"
        run: |
          echo "🚀 Deploying to production..."
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          # Add actual deployment commands here
          # kubectl set image deployment/api api=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: "🔎 Run staging/prod contract preflight"
        run: bash ops/scripts/staging-preflight-contract.sh
        env:
          ARTIFACT_REF: ${{ github.sha }}
          ARTIFACT_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          ENV_PRODUCTION_FILE: ${{ secrets.NG_PROD_RUNTIME_ENV_PRODUCTION_FILE || secrets.ENV_PRODUCTION_FILE }}
          DATABASE_URL: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL || secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.NG_PROD_RUNTIME_REDIS_URL || secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.NG_PROD_RUNTIME_JWT_SECRET || secrets.JWT_SECRET }}
          PROCESS_MANAGER: ${{ secrets.NG_PROD_DEPLOY_PROCESS_MANAGER || secrets.PROCESS_MANAGER }}
          SYSTEMD_UNIT: ${{ secrets.NG_PROD_DEPLOY_SYSTEMD_UNIT || secrets.SYSTEMD_UNIT }}
          PM2_APP: ${{ secrets.NG_PROD_DEPLOY_PM2_APP || secrets.PM2_APP }}
          PM2_CONFIG: ${{ secrets.NG_PROD_DEPLOY_PM2_CONFIG || secrets.PM2_CONFIG }}

      - name: "🛡️ Run immutable go/no-go gate"
        run: bash ops/scripts/prod-go-no-go-gate.sh
        env:
          ARTIFACT_REF: ${{ github.sha }}
          ARTIFACT_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          ENV_PRODUCTION_FILE: ${{ secrets.NG_PROD_RUNTIME_ENV_PRODUCTION_FILE || secrets.ENV_PRODUCTION_FILE }}
          DATABASE_URL: ${{ secrets.NG_PROD_RUNTIME_DATABASE_URL || secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.NG_PROD_RUNTIME_REDIS_URL || secrets.REDIS_URL }}
          API_PORT: ${{ secrets.NG_PROD_RUNTIME_API_PORT || secrets.API_PORT }}
          JWT_SECRET: ${{ secrets.NG_PROD_RUNTIME_JWT_SECRET || secrets.JWT_SECRET }}
          LOG_FORMAT: ${{ secrets.NG_PROD_RUNTIME_LOG_FORMAT || 'json' }}
          PROCESS_MANAGER: ${{ secrets.NG_PROD_DEPLOY_PROCESS_MANAGER || secrets.PROCESS_MANAGER }}
          SYSTEMD_UNIT: ${{ secrets.NG_PROD_DEPLOY_SYSTEMD_UNIT || secrets.SYSTEMD_UNIT }}
          PM2_APP: ${{ secrets.NG_PROD_DEPLOY_PM2_APP || secrets.PM2_APP }}
          PM2_CONFIG: ${{ secrets.NG_PROD_DEPLOY_PM2_CONFIG || secrets.PM2_CONFIG }}
          API_BASE_URL: ${{ secrets.NG_PROD_OBS_API_BASE_URL || secrets.API_BASE_URL }}
          HEALTH_LIVE_URL: ${{ secrets.NG_PROD_OBS_API_HEALTH_LIVE_URL || secrets.API_HEALTH_LIVE_URL }}
          HEALTH_READY_URL: ${{ secrets.NG_PROD_OBS_API_HEALTH_READY_URL || secrets.API_HEALTH_READY_URL }}

      - name: "🏥 Run health checks (gate)"
        run: |
          : "${API_HEALTH_URL:?Missing API_HEALTH_URL secret}"
          : "${WEB_HEALTH_URL:?Missing WEB_HEALTH_URL secret}"
          : "${ADMIN_HEALTH_URL:?Missing ADMIN_HEALTH_URL secret}"
          echo "🏥 Running health checks..."
          curl -f "$API_HEALTH_URL" || exit 1
          curl -f "$WEB_HEALTH_URL" || exit 1
          curl -f "$ADMIN_HEALTH_URL" || exit 1

      - name: "✅ Deployment complete"
        run: echo "✅ Production deployment successful!"

      - name: "📤 Upload rollback runbook"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-runbook-${{ github.sha }}
          path: artifacts/release/rollback-runbook-${{ github.sha }}.*

      - name: "📤 Upload DB runtime signals report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-runtime-signals-${{ github.sha }}
          path: artifacts/release/db-runtime-signals-prod.json

      - name: "📤 Upload scaling + chaos reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-resilience-reports-${{ github.sha }}
          path: |
            artifacts/release/scaling-readiness-report.json
            artifacts/release/chaos-rollback-drill-report.json

      - name: "🚨 Notify deploy gate failure (Slack/Teams)"
        if: failure()
        continue-on-error: true
        run: node scripts/release/notify-gate-failure.mjs
        env:
          GATE_NAME: deploy-production
          DEPLOY_ENV: production
          SLACK_WEBHOOK_URL: ${{ secrets.NG_ALERTS_SLACK_WEBHOOK || '' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.NG_ALERTS_TEAMS_WEBHOOK || '' }}

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6: Post-Deploy Verification
  # ═══════════════════════════════════════════════════════════════════════════
  verify:
    name: "✅ Post-Deploy Verification"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: "🏥 Verify API health"
        run: |
          echo "Verifying API health..."
          : "${API_HEALTH_URL:?Missing API_HEALTH_URL secret}"
          : "${WEB_HEALTH_URL:?Missing WEB_HEALTH_URL secret}"
          : "${ADMIN_HEALTH_URL:?Missing ADMIN_HEALTH_URL secret}"
          curl -f "$API_HEALTH_URL" || exit 1
          curl -f "$WEB_HEALTH_URL" || exit 1
          curl -f "$ADMIN_HEALTH_URL" || exit 1

      - name: "📊 Generate deployment summary"
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker | ✅ Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deploy | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
