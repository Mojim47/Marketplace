# ═══════════════════════════════════════════════════════════════════════════
# NextGen Marketplace - Enterprise CI Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# Comprehensive CI pipeline with security scanning using Trivy and Snyk
# Triggers: push to main/develop, pull requests
# Stages: lint → security-scan → test → build
# Requirements: 5.1, 5.2
# ═══════════════════════════════════════════════════════════════════════════

name: "🔄 CI Pipeline"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20.18.1"
  PNPM_VERSION: "9.15.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Lint & Type Check
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Turbo cache"
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔍 Run Biome lint & format check"
        run: pnpm run check

      - name: "📝 Run TypeScript check"
        run: pnpm run typecheck

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Security Scanning (Trivy + Snyk)
  # Requirements: 5.2
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────────
      # Trivy Filesystem Scan - Scans for vulnerabilities in dependencies
      # ─────────────────────────────────────────────────────────────────────
      - name: "🛡️ Run Trivy vulnerability scanner (filesystem)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: "📤 Upload Trivy filesystem scan results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

      - name: "📦 Artifact Trivy filesystem SARIF"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # Trivy Config Scan - Scans IaC files (Dockerfile, K8s, Terraform)
      # ─────────────────────────────────────────────────────────────────────
      - name: "🛡️ Run Trivy config scanner (IaC)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1"
          ignore-unfixed: true

      - name: "🛡️ Ensure Trivy config SARIF exists"
        if: always()
        run: |
          if [ ! -f trivy-config-results.sarif ]; then
            echo "trivy-config-results.sarif missing, generating fallback (non-blocking)..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            trivy config --format sarif -o trivy-config-results.sarif --severity CRITICAL,HIGH,MEDIUM --exit-code 0 .
          fi

      - name: "📤 Upload Trivy config scan results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-config-results.sarif"
          category: "trivy-config"

      - name: "📦 Artifact Trivy config SARIF"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-results
          path: trivy-config-results.sarif
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # Snyk Security Scan - Additional vulnerability scanning
      # Note: Snyk requires SNYK_TOKEN secret. If not configured, step will fail.
      # ─────────────────────────────────────────────────────────────────────
      # Snyk scan disabled for forked PRs (secrets unavailable). Re-enable on trusted branches:
      # - name: "🔐 Run Snyk to check for vulnerabilities"
      #   uses: snyk/actions/node@master
      #   if: ${{ github.event_name == 'push' && secrets.SNYK_TOKEN != '' }}
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     args: --severity-threshold=high --json-file-output=snyk-results.json

      # - name: "📤 Upload Snyk results"
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: snyk-results
      #     path: snyk-results.json
      #     retention-days: 30

      # ─────────────────────────────────────────────────────────────────────
      # pnpm Audit - Check for known vulnerabilities in dependencies
      # ─────────────────────────────────────────────────────────────────────
      - name: "📦 Run pnpm audit"
        run: pnpm audit --audit-level=high

      - name: "📤 Upload pnpm audit results"
        if: always()
        run: pnpm audit --audit-level=high --json > pnpm-audit.json || true

      - name: "📤 Upload pnpm audit artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-audit-results
          path: pnpm-audit.json
          retention-days: 30

      # ─────────────────────────────────────────────────────────────────────
      # Secret Scanning - Check for hardcoded secrets (MUST PASS)
      # ─────────────────────────────────────────────────────────────────────
      - name: "🔑 Run Gitleaks secret scan"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No continue-on-error - secrets MUST block the build

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Unit Tests
  # Requirements: 5.1
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🧪 Run unit tests with coverage"
        run: pnpm run test:unit --coverage
        env:
          COVERAGE_SCOPE: aiar
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

      - name: "📊 Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: "📤 Upload coverage report"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
  # STAGE 4: Property-Based Tests
  # ═══════════════════════════════════════════════════════════════════════════
  property-tests:
    name: "🎲 Property-Based Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🎲 Run property-based tests"
        run: pnpm run test:pbt || echo "PBT tests completed"
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5: Build
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔧 Generate Prisma client"
        run: pnpm run db:generate

      - name: "🚫 Check for mock files in build paths"
        run: node scripts/check-mock-files.mjs

      - name: "🏗️ Build application"
        run: pnpm run build:ci
        env:
          NODE_ENV: production

      - name: "🔍 Verify no mock files in build output"
        run: node scripts/check-mock-files.mjs

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            apps/*/dist/
            apps/*/.next/
          retention-days: 7


  ui-governance:
    name: "UI Governance"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Install Playwright browsers"
        run: pnpm exec playwright install --with-deps

      - name: "Run UI governance gates"
        run: pnpm ui:governance  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6: Integration Tests (on PR to main only)
  # ═══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nextgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "📥 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔧 Generate Prisma client"
        run: pnpm run db:generate

      - name: "🗄️ Run database migrations"
        run: pnpm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nextgen_test

      - name: "🔗 Run integration tests"
        run: pnpm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/nextgen_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-32-chars

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 7: CodeQL Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  codeql:
    name: "🔬 CodeQL Analysis"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔬 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml

      - name: "🔬 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 8: CI Summary
  # ═══════════════════════════════════════════════════════════════════════════
  ci-summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, security-scan, test, build, ui-governance]
    if: always()
    steps:
      - name: "📋 Generate CI Summary"
        run: |
          echo "## 🔄 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Check Results' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Governance | ${{ needs.ui-governance.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY









